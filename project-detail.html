<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="高峥的项目详情">
    <title>项目详情 · 高峥</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=return-links-top-1">
    <script src="project-detail.js?v=mini-program-detail-2" defer></script>
  </head>
  <body class="project-detail-page">
    <header class="project-detail-topbar">
      <a class="brand" href="index.html#projects"><span class="brand-icon" aria-hidden="true">G</span><span>PLAYER.ONE</span></a>
      <div class="project-detail-tools">
        <div class="language-switch" role="group" aria-label="选择语言">
          <button class="language-option is-active" type="button" data-detail-language="zh" aria-pressed="true">中文</button>
          <span aria-hidden="true">/</span>
          <button class="language-option" type="button" data-detail-language="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>
    <main id="main" class="project-detail-main">
      <div class="scene-container">
        <a class="project-detail-back" href="index.html#projects" data-detail-back>← 返回项目列表</a>
        <p class="pixel-label" data-detail-label>AI PROJECT // QUEST DETAIL</p>
        <article class="project-detail-card pixel-panel">
          <div class="project-detail-art" data-detail-art aria-hidden="true"><span>✦</span></div>
          <figure class="project-detail-image" data-detail-image hidden>
            <img src="" alt="">
          </figure>
          <div class="project-detail-copy">
            <p class="pixel-label" data-detail-category></p>
            <h1 data-detail-title></h1>
            <p data-detail-description></p>
          </div>
        </article>
      </div>
    </main>
    <div class="scanlines" aria-hidden="true"></div>
  </body>
</html>
